<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay Chuyển đổi số – Phường Ô Chợ Dừa</title>
<link rel="preload" as="image" href="assets/bg-m.webp" type="image/webp" media="(max-width:900px)">
<link rel="preload" as="image" href="assets/bg-d.webp" type="image/webp" media="(min-width:901px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root{
    --ink:#1f3350; --ink2:#46597a; --u:4px; --v:4px;
    --blue-a:#7cc4ff; --blue-b:#2f8cf0; --blue-t:#eaf5ff;
    --mint-a:#7debc1; --mint-b:#1fbf8f; --mint-t:#e8fbf3;
    --sun-a:#ffe27a;  --sun-b:#ffae1f;  --sun-t:#fff6da;
    --coral-a:#ff9c8f;--coral-b:#f2584a;--coral-t:#ffedea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:'Roboto',system-ui,'Segoe UI',Arial,sans-serif;color:var(--ink);
    background:#0f68c8;overflow:hidden}
  #app{height:100%;height:100dvh;background:#1273d6 url(assets/bg-m.jpg) center bottom/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  @media (min-width:901px){#app{background-image:url(assets/bg-d.jpg)}}
  @supports (background-image:image-set(url(a.webp) type("image/webp"))){
    #app{background-image:image-set(url(assets/bg-m.webp) type("image/webp"),url(assets/bg-m.jpg) type("image/jpeg"))}
    @media (min-width:901px){#app{background-image:image-set(url(assets/bg-d.webp) type("image/webp"),url(assets/bg-d.jpg) type("image/jpeg"))}}
  }
  #stage{position:relative;perspective:2200px;flex:none}
  .book{position:relative;width:100%;height:100%}
  /* ===== trang sách ===== */
  .page{position:absolute;inset:0;border-radius:calc(var(--u)*3.2);background:#fffdf8;overflow:hidden;
    transform-origin:left center;transform:rotateY(0);transition:transform .8s cubic-bezier(.45,.05,.25,1),opacity .35s ease .45s;
    backface-visibility:hidden;will-change:transform}
  #stage::before{content:"";position:absolute;inset:0;border-radius:calc(var(--u)*3.2);box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3.5) rgba(45,80,130,.16)}
  .page.turned{transform:rotateY(-105deg);opacity:0;pointer-events:none;transition:transform .8s cubic-bezier(.45,.05,.25,1),opacity .3s ease .5s}
  .page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*5);z-index:5;pointer-events:none;
    background:linear-gradient(90deg,rgba(60,90,140,.13),rgba(60,90,140,0))}
  .page::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;
    background:linear-gradient(100deg,rgba(255,255,255,.0) 55%,rgba(255,255,255,.35));}
  .blob{position:absolute;border-radius:50%;filter:blur(calc(var(--u)*6));opacity:.7;pointer-events:none}
  .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:calc(var(--u)*6) calc(var(--u)*7) calc(var(--u)*4) calc(var(--u)*8)}
  .top{display:flex;justify-content:space-between;align-items:center;flex:none}
  .pill{font-weight:700;font-size:calc(var(--u)*3.3);padding:calc(var(--u)*1.1) calc(var(--u)*3);border-radius:99px;color:#fff;
    background:linear-gradient(180deg,var(--a),var(--b));box-shadow:inset 0 calc(var(--u)*.35) calc(var(--u)*.4) rgba(255,255,255,.55)}
  .pno{font-size:calc(var(--u)*3.2);font-weight:700;color:var(--ink2);opacity:.8}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;gap:calc(var(--u)*3);overflow:auto;scrollbar-width:none}
  .main::-webkit-scrollbar{display:none}
  .ico{width:calc(var(--u)*18);height:calc(var(--u)*18);flex:none}
  h1.t{margin:0;font-size:calc(var(--v)*6.8);line-height:1.15;font-weight:900;color:var(--ink);letter-spacing:-.01em}
  .lead{margin:0;font-size:calc(var(--v)*4.7);line-height:1.38;color:var(--ink2);font-weight:500}
  ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*2.4);width:100%;text-align:left}
  ul.items li{display:flex;gap:calc(var(--u)*3);align-items:center;font-size:calc(var(--v)*4.5);line-height:1.3;font-weight:500;color:var(--ink);
    background:#fff;border-radius:calc(var(--u)*4);padding:calc(var(--u)*2.6) calc(var(--u)*3.2);
    box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.8) rgba(60,100,160,.10), inset 0 0 0 calc(var(--u)*.0) transparent}
  .bd{flex:none;width:calc(var(--u)*8.2);height:calc(var(--u)*8.2);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:calc(var(--u)*4.4);
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 42%),linear-gradient(150deg,var(--a),var(--b));
    box-shadow:inset 0 calc(var(--u)*-.6) calc(var(--u)*.9) rgba(0,0,0,.10)}
  .bd svg{width:60%;height:60%}
  .note{width:100%;border-radius:calc(var(--u)*4);padding:calc(var(--u)*3) calc(var(--u)*4);font-size:calc(var(--v)*4.3);line-height:1.35;font-weight:700;color:var(--ink);
    background:var(--t);text-align:center}
  .foot{display:flex;align-items:center;gap:calc(var(--u)*2);justify-content:center;flex:none;font-size:calc(var(--u)*2.9);color:var(--ink2);font-weight:500;opacity:.85;padding-top:calc(var(--u)*1.5)}
  .foot img{width:calc(var(--u)*5);height:calc(var(--u)*5)}
  /* ===== bìa ===== */
  .cover{background:linear-gradient(165deg,#bfe3ff 0%,#eaf7ff 45%,#fff0c9 100%)}
  .cover .main{gap:calc(var(--u)*3.5)}
  .logo{width:calc(var(--u)*30);height:calc(var(--u)*30);filter:drop-shadow(0 calc(var(--u)*.8) calc(var(--u)*1.4) rgba(120,80,0,.22))}
  .cover .kick{font-size:calc(var(--u)*3.8);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#2a6cc0}
  .cover h1{margin:0;font-size:calc(var(--u)*10.5);line-height:1.05;font-weight:900;color:#17407a}
  .cover .ward{font-size:calc(var(--u)*5);font-weight:700;color:var(--ink2)}
  .floaters{position:absolute;inset:0;z-index:1;pointer-events:none}
  .floaters svg{display:block;width:calc(var(--u)*17);height:calc(var(--u)*17);animation:bob 4.5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(calc(var(--u)*-2))}}
  .startbtn{border:0;cursor:pointer;font:inherit;font-weight:900;font-size:calc(var(--u)*6);color:#fff;padding:calc(var(--u)*3.4) calc(var(--u)*11);border-radius:99px;
    background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 45%),linear-gradient(160deg,#ffbe3d,#ff8a1f);
    box-shadow:0 calc(var(--u)*1) calc(var(--u)*2.4) rgba(255,140,30,.38), inset 0 calc(var(--u)*-.8) calc(var(--u)*1) rgba(160,70,0,.18);animation:pulse 1.8s ease-in-out infinite}
  .startbtn:active{transform:scale(.97)}
  @keyframes pulse{50%{transform:scale(1.045)}}
  .hint{font-size:calc(var(--u)*3.3);color:var(--ink2);font-weight:500}
  /* ===== liên hệ ===== */
  .box{width:100%;background:#fff;border-radius:calc(var(--u)*4.5);padding:calc(var(--u)*3.6);display:flex;align-items:center;gap:calc(var(--u)*3.4);text-align:left;
    box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.8) rgba(60,100,160,.10)}
  .box .ico{width:calc(var(--u)*14);height:calc(var(--u)*14)}
  .box b{display:block;font-size:calc(var(--u)*4.7);line-height:1.2;font-weight:900}
  .box span{display:block;font-size:calc(var(--u)*3.6);color:var(--ink2);font-weight:500;margin-top:calc(var(--u)*.6)}
  .fbbtn{display:inline-block;text-decoration:none;color:#fff;font-weight:900;font-size:calc(var(--u)*4.2);padding:calc(var(--u)*2.4) calc(var(--u)*6);border-radius:99px;
    background:linear-gradient(160deg,#5aa9ff,#2c73e8);box-shadow:inset 0 calc(var(--u)*-.6) calc(var(--u)*.8) rgba(0,0,60,.15)}
  #fbqr{width:calc(var(--u)*26);height:calc(var(--u)*26);border-radius:calc(var(--u)*3);background:#fff;padding:calc(var(--u)*1.5)}
  /* ===== thanh điều khiển ===== */
  #bar{display:flex;align-items:center;justify-content:center;gap:12px;flex:none}
  .cbtn{border:0;cursor:pointer;font:inherit;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
    height:58px;min-width:58px;padding:0 20px;border-radius:99px;font-size:17px;
    background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 50%),linear-gradient(160deg,#6ab6ff,#2f8cf0);
    box-shadow:0 5px 12px rgba(47,140,240,.28), inset 0 -3px 5px rgba(0,40,120,.15)}
  .cbtn.audio{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 50%),linear-gradient(160deg,#ffbe3d,#ff8a1f);box-shadow:0 5px 12px rgba(255,140,30,.3), inset 0 -3px 5px rgba(160,70,0,.15)}
  .cbtn[disabled]{background:rgba(255,255,255,.88);color:#5b6b86;box-shadow:none;cursor:default}
  .cbtn[disabled] svg path,.cbtn[disabled] svg rect{fill:#8d9bb3;stroke:#8d9bb3}
  .cbtn.arrow[disabled]{opacity:.55}
  .cbtn svg{width:24px;height:24px;flex:none}
  .cbtn:active:not([disabled]){transform:scale(.96)}
  #meta{display:flex;align-items:center;gap:14px;flex:none;font-size:15px;color:var(--ink);font-weight:500;background:rgba(255,255,255,.9);padding:6px 16px;border-radius:99px}
  .tg{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .tg input{width:20px;height:20px;accent-color:#2f8cf0}
  body.short #app{gap:8px;padding-top:6px}
  body.short .cbtn{height:48px;min-width:48px;font-size:15px;padding:0 14px}
  body.short #meta{font-size:13px;padding:4px 12px}
  [hidden]{display:none!important}
  @media (max-width:420px){ .cbtn{height:54px;padding:0 16px;font-size:16px} #bar{gap:8px} }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div class="book" id="book"></div></div>
  <div id="bar">
    <button class="cbtn arrow" id="prev" aria-label="Trang trước"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="cbtn audio" id="aud" disabled><svg id="audico" viewBox="0 0 24 24"></svg><span id="audtxt">Nghe đọc</span></button>
    <button class="cbtn arrow" id="next" aria-label="Trang sau"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="meta">
    <span id="count">Trang 1/20</span>
    <label class="tg"><input type="checkbox" id="auto" checked> Tự động đọc và lật trang</label>
  </div>
  <div id="copyright" style="padding:0;margin:0;font-size: .7rem;color: #333;text-align: center;">
    <p style="margin:0 0 4px;padding:0;">Nguyễn Anh Tú - Phòng Kinh tế phường Ô Chợ Dừa</p>
  </div>
</div>

<script src="content.js"></script>
<script>
(function(){
  var C = window.CONFIG, P = window.PAGES, N = P.length;
  var THEME = {blue:['#7cc4ff','#2f8cf0','#eaf5ff'], mint:['#7debc1','#1fbf8f','#e8fbf3'], sun:['#ffe27a','#ffae1f','#fff6da'], coral:['#ff9c8f','#f2584a','#ffedea'], violet:['#b8acff','#7561f0','#f0edff']};
  var uid = 0;

  /* ---------- icon 3D: cùng 1 nguồn sáng (trên-trái), bóng mềm, không viền ---------- */
  var G = {
    phone:'<rect x="14" y="4" width="20" height="40" rx="6" fill="W"/><rect x="17.5" y="10" width="13" height="22" rx="3" fill="D"/><circle cx="24" cy="38" r="2.2" fill="D"/>',
    chat:'<path d="M10 6h28a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6H26l-10 9v-9h-6a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6z" fill="W"/><circle cx="16" cy="20" r="2.7" fill="D"/><circle cx="24" cy="20" r="2.7" fill="D"/><circle cx="32" cy="20" r="2.7" fill="D"/>',
    doc:'<rect x="10" y="4" width="28" height="40" rx="6" fill="W"/><rect x="16" y="14" width="16" height="3.6" rx="1.8" fill="D"/><rect x="16" y="22" width="16" height="3.6" rx="1.8" fill="D"/><rect x="16" y="30" width="10" height="3.6" rx="1.8" fill="D"/>',
    bag:'<path d="M17 18v-3a7 7 0 0 1 14 0v3" fill="none" stroke="W" stroke-width="4.5" stroke-linecap="round"/><rect x="8" y="16" width="32" height="28" rx="8" fill="W"/><circle cx="18" cy="27" r="2.5" fill="D"/><circle cx="30" cy="27" r="2.5" fill="D"/>',
    qr:'<rect x="5" y="5" width="17" height="17" rx="4.5" fill="W"/><rect x="26" y="5" width="17" height="17" rx="4.5" fill="W"/><rect x="5" y="26" width="17" height="17" rx="4.5" fill="W"/><rect x="9.500" y="9.500" width="8" height="8" rx="2" fill="D"/><rect x="30.500" y="9.500" width="8" height="8" rx="2" fill="D"/><rect x="9.500" y="30.500" width="8" height="8" rx="2" fill="D"/><rect x="26" y="26" width="7.500" height="7.500" rx="2.200" fill="W"/><rect x="35.500" y="35.500" width="7.500" height="7.500" rx="2.200" fill="W"/>',
    coin:'<circle cx="24" cy="24" r="20" fill="W"/><circle cx="24" cy="24" r="14.500" fill="D"/><text x="24" y="31" text-anchor="middle" font-family="Roboto,Arial,sans-serif" font-weight="900" font-size="20" fill="W">₫</text>',
    lock:'<path d="M15 22v-6a9 9 0 0 1 18 0v6" fill="none" stroke="W" stroke-width="5" stroke-linecap="round"/><rect x="9" y="21" width="30" height="23" rx="7" fill="W"/><circle cx="24" cy="30" r="3.600" fill="D"/><rect x="22.300" y="31" width="3.400" height="7" rx="1.700" fill="D"/>',
    shield:'<path d="M24 3l16 6v13c0 10-7 17-16 21C15 39 8 32 8 22V9z" fill="W" stroke="W" stroke-width="2" stroke-linejoin="round"/><path d="M16 24l6 6 11-12" fill="none" stroke="D" stroke-width="4.500" stroke-linecap="round" stroke-linejoin="round"/>',
    warn:'<path d="M24 5c1.700 0 3.100.9 4 2.300l14.800 25.500c1.800 3.100-.4 7-4 7H9.200c-3.600 0-5.800-3.900-4-7L20 7.300C20.900 5.900 22.300 5 24 5z" fill="W"/><rect x="21.800" y="15" width="4.400" height="13" rx="2.200" fill="D"/><circle cx="24" cy="33.500" r="2.600" fill="D"/>',
    stop:'<circle cx="24" cy="24" r="20" fill="W"/><circle cx="24" cy="24" r="13" fill="none" stroke="D" stroke-width="4.500"/><rect x="9.500" y="21.500" width="29" height="5" rx="2.500" transform="rotate(-45 24 24)" fill="D"/>',
    camera:'<rect x="17" y="6" width="14" height="10" rx="3.500" fill="W"/><rect x="4" y="12" width="40" height="31" rx="8.500" fill="W"/><circle cx="24" cy="27.500" r="10" fill="D"/><circle cx="24" cy="27.500" r="5" fill="W"/><circle cx="37" cy="19" r="2.100" fill="D"/>',
    mega:'<path d="M6 19l22-11v32L6 29z" fill="W" stroke="W" stroke-width="3" stroke-linejoin="round"/><rect x="3" y="17" width="10" height="14" rx="4.500" fill="W"/><rect x="12" y="30" width="8" height="12" rx="3.500" fill="W"/><path d="M34 17a9 9 0 0 1 0 14M38.500 11a16 16 0 0 1 0 26" fill="none" stroke="W" stroke-width="3.500" stroke-linecap="round"/>',
    home:'<path d="M24 5L4 23h6v19h28V23h6z" fill="W" stroke="W" stroke-width="3" stroke-linejoin="round"/><rect x="19.500" y="28" width="9" height="14" rx="3.500" fill="D"/>',
    check:'<circle cx="24" cy="24" r="20" fill="W"/><path d="M14.500 24.500l7 7 12-14" fill="none" stroke="D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
    star:'<path d="M24 4l6.100 12.400 13.700 2-9.900 9.600 2.300 13.600L24 35.200l-12.200 6.400 2.300-13.600-9.900-9.600 13.700-2z" fill="W" stroke="W" stroke-width="3" stroke-linejoin="round"/>',
    book:'<path d="M24 12c-5-4-12-5-19-4v29c7-1 14 0 19 4z" fill="W"/><path d="M24 12c5-4 12-5 19-4v29c-7-1-14 0-19 4z" fill="W"/><rect x="23" y="12" width="2" height="29" rx="1" fill="D"/><rect x="9" y="16" width="10" height="3" rx="1.500" fill="D"/><rect x="29" y="16" width="10" height="3" rx="1.500" fill="D"/><rect x="9" y="23" width="10" height="3" rx="1.500" fill="D"/><rect x="29" y="23" width="10" height="3" rx="1.500" fill="D"/>'
  };
  function icon(key, color, cls){
    var t = THEME[color]||THEME.blue, i = ++uid, a=t[0], b=t[1];
    var g = (G[key]||G.star).replace(/fill="W"/g,'fill="url(#w'+i+')"').replace(/stroke="W"/g,'stroke="url(#w'+i+')"').replace(/fill="D"/g,'fill="'+b+'" fill-opacity=".88"').replace(/stroke="D"/g,'stroke="'+b+'" stroke-opacity=".88"');
    return '<svg class="'+(cls||'ico')+'" viewBox="0 0 96 96" aria-hidden="true"><defs>'+
      '<linearGradient id="t'+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient>'+
      '<radialGradient id="h'+i+'" cx=".3" cy=".22" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>'+
      '<linearGradient id="s'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>'+
      '<linearGradient id="w'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".86"/></linearGradient>'+
      '<filter id="f'+i+'" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="'+b+'" flood-opacity=".28"/></filter></defs>'+
      '<rect x="3" y="3" width="90" height="90" rx="30" fill="url(#t'+i+')"/><rect x="3" y="3" width="90" height="90" rx="30" fill="url(#s'+i+')"/><rect x="3" y="3" width="90" height="90" rx="30" fill="url(#h'+i+')"/>'+
      '<g transform="translate(24 24)" filter="url(#f'+i+')">'+g+'</g></svg>';
  }

  /* ---------- dựng trang ---------- */
  var book = document.getElementById('book'), els = [];
  function th(color){ var t=THEME[color]||THEME.blue; return '--a:'+t[0]+';--b:'+t[1]+';--t:'+t[2]+';'; }
  function pad(n){ return (n<10?'0':'')+n; }
  function foot(i){ return '<div class="foot"><img src="assets/logo.webp" alt="" width="20" height="20" loading="lazy" decoding="async">'+C.ward+' · '+C.title+'</div>'; }
  function check(){ return '<svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

  P.forEach(function(p, i){
    var d = document.createElement('section'); d.className='page'; d.style.zIndex = N-i; var h='';
    if(p.type==='cover'){
      d.classList.add('cover');
      h = '<div class="floaters">'+
        '<div style="position:absolute;left:5%;top:7%">'+icon('phone','blue')+'</div>'+
        '<div style="position:absolute;right:6%;top:9%">'+icon('chat','mint')+'</div>'+
        '<div style="position:absolute;left:7%;bottom:9%">'+icon('bag','sun')+'</div>'+
        '<div style="position:absolute;right:7%;bottom:7%">'+icon('shield','coral')+'</div></div>'+
        '<div class="inner"><div class="main">'+
        '<img class="logo" width="120" height="120" fetchpriority="high" src="assets/logo.webp" alt="Logo phường Ô Chợ Dừa">'+
        '<div class="kick">Ủy ban nhân dân</div><div class="ward">'+C.ward+'</div>'+
        '<h1>SỔ TAY<br>CHUYỂN ĐỔI SỐ</h1>'+
        '<button class="startbtn" id="startbtn">Bắt đầu</button>'+
        '<div class="hint">Chạm để mở sách</div></div></div>';
    } else if(p.type==='contact'){
      var t = THEME.blue;
      d.style.cssText += th('blue');
      h = '<div class="blob" style="width:60%;height:30%;right:-15%;top:-6%;background:#cfe8ff"></div>'+
        '<div class="inner"><div class="top"><span class="pill">Liên hệ</span><span class="pno">'+(i+1)+' / '+N+'</span></div><div class="main">'+
        '<h1 class="t">Theo dõi phường</h1>'+
        '<div class="box">'+icon('chat','blue')+'<div><b>Fanpage</b><span>'+C.fanpageName+'</span></div></div>'+
        (C.fanpageUrl?'<a class="fbbtn" href="'+C.fanpageUrl+'" target="_blank" rel="noopener">Mở Fanpage</a><img id="fbqr" alt="Mã QR Fanpage" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(C.fanpageUrl)+'">':'')+
        '<h1 class="t">Theo dõi Fanpage Công an phường</h1>'+
        '<div class="box">'+icon('chat','blue')+'<div><b>Fanpage</b><span>'+C.fanpagePoliceWardName+'</span></div></div>'+
        (C.policeWardUrl?'<a class="fbbtn" href="'+C.policeWardUrl+'" target="_blank" rel="noopener">Mở Fanpage</a><img id="fbqr" alt="Mã QR Fanpage" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(C.policeWardUrl)+'">':'')+
        (C.hotlinePolice?'Hotline: <a class="fbbtn" href="tel:'+C.hotlinePolice+'" target="_blank" rel="noopener">'+C.hotlinePolice+'</a>':'')+
        '<h1 class="t">Theo dõi Fanpage Trạm Y tế phường</h1>'+
        '<div class="box">'+icon('chat','yellow')+'<div><b>Fanpage</b><span>'+C.fanpageMedicalWardName+'</span></div></div>'+
        (C.medicalWardUrl?'<a class="fbbtn" href="'+C.medicalWardUrl+'" target="_blank" rel="noopener">Mở Fanpage</a><img id="fbqr" alt="Mã QR Fanpage" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(C.mediacalWardUrl)+'">':'')+
        (C.hotlineMedical?'Hotline: <a class="fbbtn" href="tel:'+C.hotlineMedical+'" target="_blank" rel="noopener">'+C.hotlineMedical+'</a>':'')+
        '<div class="box">'+icon('shield','coral')+'<div><b>Nghi ngờ lừa đảo?</b><span>Báo công an phường qua hotline CAP hoặc gọi 113</span></div></div>'+
        '<div class="note" style="--t:#fff6da">Xin cảm ơn bà con đã đồng hành cùng chuyển đổi số của phường!</div>'+
        '</div>'+foot(i)+'</div>';
    } else {
      d.style.cssText += th(p.color);
      var items='';
      if(p.items){ items='<ul class="items">'+p.items.map(function(x,k){ return '<li><span class="bd">'+(p.numbered?(k+1):check())+'</span><span>'+x+'</span></li>'; }).join('')+'</ul>'; }
      h = '<div class="blob" style="width:60%;height:30%;right:-15%;top:-6%;background:var(--t)"></div>'+
        '<div class="inner"><div class="top"><span class="pill">'+p.sec+'</span><span class="pno">'+(i+1)+' / '+N+'</span></div>'+
        '<div class="main">'+icon(p.icon,p.color)+'<h1 class="t">'+p.title+'</h1>'+(p.lead?'<p class="lead">'+p.lead+'</p>':'')+items+(p.note?'<div class="note">'+p.note+'</div>':'')+'</div>'+foot(i)+'</div>';
    }
    d.innerHTML = h; book.appendChild(d); els.push(d);
  });

  /* ---------- kích thước ---------- */
  var stage = document.getElementById('stage');
  function fit(){
    var W = window.innerWidth, H = window.innerHeight, short = H < 720;
    document.body.classList.toggle('short', short);
    var hA = H - (short ? 114 : 144), wA = W - 20;
    var h = hA, w = Math.min(wA, h*0.70);
    if(w/h < 0.55){ h = w/0.55; }
    stage.style.width = w+'px'; stage.style.height = h+'px';
    var root = document.documentElement.style;
    root.setProperty('--u', (w/100)+'px');
    /* chữ to nhất có thể mà không trang nào bị tràn/che */
    var k = 1.2, mains = document.querySelectorAll('.page .main');
    for(;;){
      root.setProperty('--v', (w/100*k)+'px');
      var ok = true;
      for(var i=0;i<mains.length;i++){ if(mains[i].scrollHeight > mains[i].clientHeight) { ok=false; break; } }
      if(ok || k <= 0.6) break; k -= 0.03;
    }
  }
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(fit,120); }); fit();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

  /* ---------- điều hướng ---------- */
  var cur = 0, started = false;
  var prev = document.getElementById('prev'), next = document.getElementById('next'), aud = document.getElementById('aud'),
      audtxt = document.getElementById('audtxt'), audico = document.getElementById('audico'), count = document.getElementById('count'), auto = document.getElementById('auto');
  var ICON_PLAY='<path d="M7 4.500l13 7.500-13 7.500z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>',
      ICON_PAUSE='<rect x="6" y="4.500" width="4.600" height="15" rx="2" fill="#fff"/><rect x="13.400" y="4.500" width="4.600" height="15" rx="2" fill="#fff"/>';
  var a = new Audio(), token = 0, avail = false, playing = false, advTimer = null;

  function setAud(){
    audico.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    aud.disabled = !avail;
    audtxt.textContent = !avail ? 'Chưa có audio' : (playing ? 'Tạm dừng' : 'Nghe đọc');
  }
  function loadAudio(i, tryPlay){
    var my = ++token; clearTimeout(advTimer);
    a.pause(); playing=false; avail=false; setAud();
    a.onloadedmetadata=function(){ if(my!==token) return; avail=true; setAud(); if(tryPlay) play(); };
    a.onerror=function(){ if(my!==token) return; avail=false; setAud(); };
    a.onended=function(){ if(my!==token) return; playing=false; setAud(); if(auto.checked && cur<N-1){ advTimer=setTimeout(function(){ go(cur+1); },900); } };
    a.onpause=function(){ if(my!==token) return; playing=false; setAud(); };
    a.onplay=function(){ if(my!==token) return; playing=true; setAud(); };
    a.src='audio/trang-'+pad(i+1)+'.mp3'; a.load();
  }
  function play(){ var pr=a.play(); if(pr&&pr.catch) pr.catch(function(){ playing=false; setAud(); }); }
  aud.addEventListener('click', function(){ if(!avail) return; if(a.paused) play(); else a.pause(); });

  function go(n, fromUser){
    n = Math.max(0, Math.min(N-1, n)); if(n===cur && started) return;
    cur = n;
    els.forEach(function(e,k){ e.classList.toggle('turned', k<cur); });
    count.textContent = 'Trang '+(cur+1)+'/'+N;
    prev.disabled = cur===0; next.disabled = cur===N-1;
    loadAudio(cur, started && auto.checked);
  }
  prev.addEventListener('click', function(){ go(cur-1,true); });
  next.addEventListener('click', function(){ go(cur+1,true); });
  document.addEventListener('keydown', function(e){ if(e.key==='ArrowRight') go(cur+1,true); if(e.key==='ArrowLeft') go(cur-1,true); });
  var sx=null; stage.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; sx=null; if(dx<-45) go(cur+1,true); else if(dx>45) go(cur-1,true); });

  document.getElementById('startbtn').addEventListener('click', function(){ started=true; go(1,true); });
  auto.addEventListener('change', function(){ if(auto.checked && avail && a.paused) play(); if(!auto.checked) clearTimeout(advTimer); });

  go(0); prev.disabled = true; started = false;
  window.__go = go; // phục vụ kiểm thử
})();
</script>
</body>
</html>
